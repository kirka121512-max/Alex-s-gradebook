<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alex's School Hub</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#191e27;--line:#303846;--muted:#a5afbf;--ink:#f4f6fa;--accent:#b7f08b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 14px;background:#252d3b;color:var(--ink)}button:hover{background:#354154}button.primary{background:var(--accent);color:#18220f;border-color:var(--accent);font-weight:700}button.small{padding:5px 9px;font-size:12px}button.danger{color:#ffb6b6}button:disabled{opacity:.45;cursor:default}input,select,textarea{background:#11161e;border:1px solid #414b5a;border-radius:8px;color:var(--ink);padding:10px;width:100%;min-width:0}input[type=checkbox]{width:auto}textarea{min-height:130px;resize:vertical}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 4px}h1,h2,h3,p{margin-top:0}h1{font-size:32px;letter-spacing:-1px;margin-bottom:6px}h2{font-size:21px}h3{font-size:16px}a{color:var(--accent)}aside{width:228px;position:fixed;inset:0 auto 0 0;border-right:1px solid var(--line);padding:28px 20px;background:#131821}.brand{font-size:20px;font-weight:800;line-height:1.25;margin:0 0 32px}.brand span{color:var(--accent)}nav{display:grid;gap:7px}nav button{text-align:left;background:transparent;border-color:transparent}nav button.active{background:#2b382a;color:var(--accent)}.sidefoot{position:absolute;bottom:24px;left:20px;right:20px;font-size:12px;color:var(--muted)}main{margin-left:228px;padding:30px 38px;max-width:1600px}.topbar,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.topbar{justify-content:space-between;margin-bottom:30px}.topbar select{width:180px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--accent);font-weight:700}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stat{font-size:40px;letter-spacing:-1.5px;font-weight:750;line-height:1.2}.hero{background:linear-gradient(120deg,#25362b,#1a2630);border-color:#486047}.pill{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:3px 10px;font-size:12px;color:var(--muted)}.badge{color:var(--accent)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button.active{background:var(--accent);color:#18220f}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}td,th{padding:13px 10px;border-bottom:1px solid var(--line)}td input{min-width:78px;padding:6px;width:92px}.empty{padding:30px;text-align:center;color:var(--muted)}.hint{border-left:3px solid var(--accent);padding:10px 14px;background:#1c2924;margin:16px 0;color:#d9e5d3;font-size:13px}.error{color:#ffb6b6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.toolbar input{max-width:280px}.toolbar select{width:auto}.spacer{flex:1}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:115px;border:1px solid var(--line);border-radius:7px;padding:7px;overflow:hidden}.day.today{border-color:var(--accent)}.day.off{opacity:.25}.day button{display:block;text-align:left;width:100%;font-size:10px;padding:4px;margin-top:4px;word-break:break-word}.weekday{text-align:center;font-size:11px;color:var(--muted)}.source{white-space:pre-wrap;max-height:330px;overflow:auto;background:#11161e;padding:16px;border-radius:9px;font-size:14px}.hit{border-bottom:1px solid var(--line);padding:14px 0}.flash{min-height:180px;display:grid;place-items:center;text-align:center;font-size:23px;background:#11161e;border-radius:10px;padding:20px;margin:18px 0}.flash p{margin:0}dialog{border:1px solid #4c5869;border-radius:16px;background:var(--panel);color:var(--ink);padding:26px;width:min(620px,94vw);max-height:90vh}dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.close{float:right}.toast{position:fixed;bottom:25px;right:25px;background:var(--accent);color:#17220f;max-width:420px;padding:13px 20px;border-radius:10px;z-index:99;box-shadow:0 4px 30px #0005}.storage{font-size:12px;color:var(--muted);margin-bottom:18px}.footer{font-size:12px;color:var(--muted);padding:24px 0}.rule{border-left:3px solid var(--accent)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:24px}.two{grid-template-columns:1fr}}@media(max-width:700px){aside{position:static;width:auto;padding:18px;border-bottom:1px solid var(--line)}.brand{margin-bottom:12px}.sidefoot{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{margin-left:0;padding:18px}.grid{grid-template-columns:1fr 1fr}.stat{font-size:32px}.card{padding:16px}.day{min-height:85px;padding:3px}.topbar{margin-bottom:20px}h1{font-size:27px}}@media print{aside,.topbar button,.actions,button{display:none}main{margin:0}body{background:white;color:black}.card{break-inside:avoid}}
</style></head><body>
<aside><div class="brand"><span>◈</span> Alex's<br>School Hub</div><nav id="nav"></nav><div class="sidefoot">PROGRESS OVER PERFECTION<br><br>Local edition · No account required<br>Your data stays in this browser.</div></aside>
<main><div class="topbar"><div class="eyebrow">Your school life, organized.</div><div class="row"><select id="period" aria-label="Grading period"></select><button id="newPeriod">+ Period</button><button id="backupTop">Back up</button></div></div><div id="storage" class="storage"></div><div id="app"></div><div class="footer">Local browser app · No cloud sync or Notion connection. Export a backup regularly, especially before moving or renaming this file.</div></main>
<dialog id="modal"></dialog><div id="toast" class="toast" hidden></div>
<script>
'use strict';
// SELF-CONTAINED LOCAL APP. No external scripts, APIs, tracking or network requests.
const KEY='alex-school-hub-v1';
const SUBJECTS=['Science','Math','English','History','French','Latin'];
const COLORS={Science:'#a5df95',Math:'#95bcff',English:'#cfb4ff',History:'#edc68b',French:'#ffb2c8',Latin:'#8bdbdf'};
const DEFAULT_RULES={Science:{mode:'multiplier',weights:{Homework:1,Quiz:2,Test:4,Lab:4}},Math:{mode:'category',weights:{Test:70,Quiz:20,Homework:10}},English:{mode:'manual',weights:{}},History:{mode:'multiplier',weights:{Homework:1,Quiz:5,Test:10}},French:{mode:'category',weights:{Test:50,Quiz:25,Homework:15,Participation:10}},Latin:{mode:'category',weights:{Test:60,Quiz:30,Homework:10}}};
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const opts=(a,v)=>a.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const pct=n=>n===null?'—':n.toFixed(2)+'%';
const number=v=>v===''||v===null||v===undefined?null:Number(v);
function fresh(){return {version:1,periods:[{id:'period-1',name:'Current period',rules:clone(DEFAULT_RULES),english:null,participation:null}],active:'period-1',items:[],sources:[],cards:[]};}
let data=fresh(),storageOK=true;
try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);validateData(parsed);data=parsed;}}catch(e){storageOK=false;}
let page='Dashboard',filter='All',search='',studySubject='Science',calendarDate=new Date(),plannerMode='Agenda',calendarField='due',deckIndex=0,revealed=false,importState=null;
function period(){return data.periods.find(p=>p.id===data.active);}
function items(){return data.items.filter(x=>x.period===data.active);}
function validGrade(v){return v===null||(typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=100);}
function validateData(d){
 if(!d||d.version!==1||!Array.isArray(d.periods)||!d.periods.length||!Array.isArray(d.items)||!Array.isArray(d.sources)||!Array.isArray(d.cards))throw Error('Not a School Hub backup.');
 const ids=new Set();for(const p of d.periods){if(typeof p.id!=='string'||ids.has(p.id)||typeof p.name!=='string')throw Error('Invalid periods.');ids.add(p.id);if(!validGrade(p.english)||!validGrade(p.participation))throw Error('Invalid overall score.');for(const s of SUBJECTS){const r=p.rules?.[s];if(!r||!['category','multiplier','manual'].includes(r.mode)||!r.weights||Object.values(r.weights).some(v=>typeof v!=='number'||!Number.isFinite(v)||v<0))throw Error('Invalid grading rules.');}}
 if(!ids.has(d.active))throw Error('Invalid active period.');
 const used=new Set();for(const x of d.items){if(typeof x.id!=='string'||used.has(x.id)||!ids.has(x.period)||!SUBJECTS.includes(x.subject)||typeof x.name!=='string'||typeof x.type!=='string'||!validGrade(x.grade)||!['To do','Working','Submitted','Complete'].includes(x.status)||!['Low','Medium','High'].includes(x.priority)||typeof x.notes!=='string'||typeof x.due!=='string'||typeof x.study!=='string'||(x.due&&!dateOK(x.due))||(x.study&&!dateOK(x.study)))throw Error('Invalid assignment.');used.add(x.id);}
 for(const s of d.sources)if(typeof s.id!=='string'||typeof s.title!=='string'||typeof s.text!=='string'||!SUBJECTS.includes(s.subject))throw Error('Invalid source.');
 for(const c of d.cards)if(typeof c.id!=='string'||typeof c.q!=='string'||typeof c.a!=='string'||!SUBJECTS.includes(c.subject)||typeof c.source!=='string')throw Error('Invalid card.');
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;}catch(e){storageOK=false;toast('Browser storage is unavailable or full. Export a backup now.');}updateStorage();}
function updateStorage(){$('#storage').textContent=storageOK?'● Saved locally in this browser. Use Back up to keep a portable copy.':'⚠ Storage could not be loaded or saved. Your current work is in memory only—export a backup.';}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,5000);}
function stats(subject,p=period(),all=items()){
 const rule=p.rules[subject];if(rule.mode==='manual')return {average:p.english,provisional:p.english===null,categories:[],count:0};
 const rows=all.filter(x=>x.subject===subject&&x.grade!==null&&!x.excluded);
 let numerator=0,denominator=0,missing=[],categories=[];
 for(const [type,w] of Object.entries(rule.weights)){
  const scores=subject==='French'&&type==='Participation'?(p.participation===null?[]:[p.participation]):rows.filter(x=>x.type===type).map(x=>x.grade);
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null;
  if(w>0){if(avg===null)missing.push(type);else{const weight=rule.mode==='multiplier'?w*scores.length:w;numerator+=avg*weight;denominator+=weight;}}
  categories.push({type,weight:w,average:avg,count:scores.length});
 }
 return {average:denominator?numerator/denominator:null,provisional:rule.mode==='category'&&(missing.length>0||Object.values(rule.weights).reduce((a,b)=>a+b,0)!==100),categories,count:rows.length};
}
function grand(){const averages=SUBJECTS.map(s=>stats(s).average).filter(v=>v!==null);return {average:averages.length?averages.reduce((a,b)=>a+b,0)/averages.length:null,count:averages.length};}
function openTask(x){return !['Submitted','Complete'].includes(x.status);}
function render(){
 $('#nav').innerHTML=['Dashboard','Enter grades','Planner','Study space','Settings','Import & backup'].map(n=>`<button class="${page===n?'active':''}" data-page="${n}">${n}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();});
 $('#period').innerHTML=data.periods.map(p=>`<option value="${esc(p.id)}" ${p.id===data.active?'selected':''}>${esc(p.name)}</option>`).join('');updateStorage();
 ({Dashboard:dashboard,'Enter grades':gradebook,Planner:planner,'Study space':study,Settings:settings,'Import & backup':backupPage}[page])();
}
function dashboard(){const g=grand(),due=items().filter(openTask).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),over=due.filter(x=>x.due&&x.due<today());
 $('#app').innerHTML=`<h1>Make room for progress.</h1><p class="muted">Your grades and your next steps, all in one place.</p><div class="grid"><div class="card hero"><div class="eyebrow">Grand average</div><div class="stat">${pct(g.average)}</div><p class="muted">${g.count} of 6 classes · equal class weight</p><small>Based on entered grades, not an official report card.</small></div><div class="card"><span class="muted">Open tasks</span><div class="stat">${due.length}</div><p>Across your current period</p><button id="planGo">Open planner →</button></div><div class="card"><span class="muted">Overdue</span><div class="stat">${over.length}</div><p>${over.length?'A few things to catch up on.':'A little breathing room.'}</p><button class="primary" id="addGo">+ Add assessment</button></div></div><h2>Your classes</h2><div class="grid">${SUBJECTS.map(s=>{const a=stats(s);return `<div class="card" style="border-top:3px solid ${COLORS[s]}"><div class="row"><h3>${s}</h3><span class="spacer"></span><span class="pill">${a.provisional?'Provisional':'Current'}</span></div><div class="stat">${pct(a.average)}</div><p class="muted">${s==='English'?'Overall grade from your teacher':a.count+' graded assessments'}</p><button data-class="${s}" class="small">View ${s} →</button></div>`}).join('')}</div><div class="card"><h2>Next up</h2>${taskTable(due.slice(0,6))}</div>`;
 $('#planGo').onclick=()=>{page='Planner';render()};$('#addGo').onclick=()=>editItem();$('#app').querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{page='Enter grades';filter=b.dataset.class;render()});bindEdit();
}
function tabs(){return `<div class="tabs">${['All',...SUBJECTS].map(s=>`<button class="${filter===s?'active':''}" data-filter="${s}">${s==='All'?'All subjects':s}</button>`).join('')}</div>`;}
function gradebook(){const list=items().filter(x=>(filter==='All'||x.subject===filter)&&(!search||(x.name+' '+x.subject+' '+x.type).toLowerCase().includes(search.toLowerCase())));
 $('#app').innerHTML=`<div class="row"><div><h1>Enter grades</h1><p class="muted">One place to enter everything. Subject tabs organize it automatically.</p></div><span class="spacer"></span><button class="primary" id="add">+ Add assessment</button></div>${tabs()}<div class="two">${filter==='All'||filter==='English'?`<div class="card"><h3>English · overall grade</h3><label for="english">Your teacher's current percentage</label><input id="english" type="number" min="0" max="100" step="any" placeholder="e.g. 93.96" value="${period().english??''}"><small class="muted">Update this single score. No English grade entries needed.</small></div>`:''}${filter==='All'||filter==='French'?`<div class="card"><h3>French · participation</h3><label for="participation">Your participation grade (not its weight)</label><input id="participation" type="number" min="0" max="100" step="any" placeholder="e.g. 95" value="${period().participation??''}"><small class="muted">Its 10% weight is already applied.</small></div>`:''}</div>${filter!=='All'?categorySummary(filter):''}<div class="toolbar"><input id="search" placeholder="Search assessments…" aria-label="Search assessments" value="${esc(search)}"><span class="muted">${list.length} entries</span></div><div class="card tablewrap"><table><thead><tr><th>Assessment</th><th>Subject</th><th>Type</th><th>Grade %</th><th>Due</th><th>Actions</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.name)}${x.excluded?' <span class="pill">Excluded</span>':''}</td><td style="color:${COLORS[x.subject]}">${x.subject}</td><td>${esc(x.type)}</td><td><input aria-label="Grade for ${esc(x.name)}" type="number" min="0" max="100" step="any" placeholder="—" value="${x.grade??''}" data-grade="${esc(x.id)}" ${x.subject==='English'?'disabled':''}></td><td>${esc(x.due||'—')}</td><td><button class="small" data-edit="${esc(x.id)}">Edit</button></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">No assessments here yet. Add one above, or import a CSV.</div>'}</div><p class="muted">Enter 95 for 95%. Blank grades are ignored; a real 0 counts. Weights are in Settings.</p>`;
 $('#add').onclick=()=>editItem();$('#app').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;search='';render()});
 $('#search').oninput=e=>{search=e.target.value;const n=e.target.selectionStart;gradebook();$('#search').focus();$('#search').setSelectionRange(n,n)};
 for(const key of ['english','participation'])if($('#'+key))$('#'+key).onchange=e=>{if(!e.target.checkValidity())return;period()[key]=number(e.target.value);save();gradebook();};
 $('#app').querySelectorAll('[data-grade]').forEach(input=>input.onchange=()=>{if(!input.checkValidity()){input.reportValidity();return;}data.items.find(x=>x.id===input.dataset.grade).grade=number(input.value);save();gradebook();});bindEdit();
}
function categorySummary(s){const a=stats(s);return `<div class="card"><div class="row"><h2>${s}: ${pct(a.average)}</h2><span class="pill">${a.provisional?'Provisional · missing categories or weights':'Based on entered grades'}</span></div>${a.categories.length?`<div class="row">${a.categories.map(c=>`<span class="pill">${esc(c.type)} ${pct(c.average)} · ${period().rules[s].mode==='multiplier'?'×'+c.weight:c.weight+'% weight'} · ${c.count} grade${c.count===1?'':'s'}</span>`).join('')}</div>`:''}</div>`;}
function bindEdit(){$('#app').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(b.dataset.edit));}
function taskTable(list){return list.length?`<div class="tablewrap"><table><thead><tr><th>Task</th><th>Subject</th><th>Due</th><th>Status</th><th>Priority</th></tr></thead><tbody>${list.map(x=>`<tr><td><button class="small" data-edit="${esc(x.id)}">${esc(x.name)}</button></td><td>${x.subject}</td><td class="${x.due&&x.due<today()&&openTask(x)?'error':''}">${esc(x.due||'No date')}</td><td>${x.status}</td><td>${x.priority}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nothing scheduled here yet.</div>';}
function showModal(html){$('#modal').innerHTML=`<button type="button" class="small close" id="closeModal" aria-label="Close">✕</button>${html}`;$('#closeModal').onclick=()=>$('#modal').close();$('#modal').showModal();}
function editItem(id){const existing=data.items.find(x=>x.id===id),x=existing||{id:uid(),period:data.active,name:'',subject:filter!=='All'?filter:'Science',type:'',grade:null,due:'',study:'',status:'To do',priority:'Medium',notes:'',excluded:false};
 showModal(`<h2>${existing?'Edit':'Add'} assessment or task</h2><form id="itemForm"><label for="iname">Name</label><input id="iname" required maxlength="200" value="${esc(x.name)}" placeholder="e.g. Chapter 2 quiz"><div class="two"><div><label for="isubject">Subject</label><select id="isubject">${opts(SUBJECTS,x.subject)}</select></div><div><label for="itype">Type</label><select id="itype"></select></div></div><label for="igrade">Grade % · leave blank until graded</label><input id="igrade" type="number" min="0" max="100" step="any" value="${x.grade??''}" placeholder="95"><div id="gradeHint" class="muted"></div><details style="margin-top:18px" ${existing?'open':''}><summary>Planner details (optional)</summary><div class="two"><div><label for="idue">Due date</label><input id="idue" type="date" value="${esc(x.due)}"></div><div><label for="istudy">Study on</label><input id="istudy" type="date" value="${esc(x.study)}"></div><div><label for="istatus">Status</label><select id="istatus">${opts(['To do','Working','Submitted','Complete'],x.status)}</select></div><div><label for="ipriority">Priority</label><select id="ipriority">${opts(['Low','Medium','High'],x.priority)}</select></div></div><label for="inotes">Notes</label><textarea id="inotes">${esc(x.notes)}</textarea><label><input id="iexclude" type="checkbox" ${x.excluded?'checked':''}> Exclude this assessment from averages</label></details><div class="actions">${existing?'<button type="button" class="danger" id="deleteItem">Delete</button>':''}<button class="primary" type="submit">Save</button></div></form>`);
 function types(){const s=$('#isubject').value,choices=Object.keys(period().rules[s].weights).filter(t=>t!=='Participation');if(s==='English')choices.push('Homework','Test','Quiz','Essay');choices.push('Study session','Other task');$('#itype').innerHTML=opts(choices,x.type||choices[0]);$('#igrade').disabled=s==='English';$('#gradeHint').textContent=s==='English'?'English tasks are for planning. Update its overall grade in Enter grades.':'';}
 types();$('#isubject').onchange=types;$('#itype').onchange=()=>{const disabled=['Study session','Other task'].includes($('#itype').value)||$('#isubject').value==='English';$('#igrade').disabled=disabled;};$('#itype').onchange();
 $('#itemForm').onsubmit=e=>{e.preventDefault();const updated={...x,name:$('#iname').value.trim(),subject:$('#isubject').value,type:$('#itype').value,grade:$('#igrade').disabled?null:number($('#igrade').value),due:$('#idue').value,study:$('#istudy').value,status:$('#istatus').value,priority:$('#ipriority').value,notes:$('#inotes').value,excluded:$('#iexclude').checked};if(!updated.name)return;if(existing)data.items[data.items.indexOf(existing)]=updated;else data.items.push(updated);save();$('#modal').close();render();toast('Saved. Averages updated.');};
 if(existing)$('#deleteItem').onclick=()=>{if(confirm('Delete this assessment? Export a backup first if you may need it later.')){data.items=data.items.filter(a=>a.id!==id);save();$('#modal').close();render();}};
}
function planner(){let list=items().filter(x=>filter==='All'||x.subject===filter);const start=today(),end=new Date(start+'T12:00:00');end.setDate(end.getDate()+7);const endStr=`${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-${String(end.getDate()).padStart(2,'0')}`;
 if(plannerMode==='Overdue')list=list.filter(x=>openTask(x)&&x.due&&x.due<start);else if(plannerMode==='This week')list=list.filter(x=>openTask(x)&&((x.due>=start&&x.due<endStr)||(x.study>=start&&x.study<endStr)));else if(plannerMode==='Agenda')list=list.filter(openTask);
 list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
 $('#app').innerHTML=`<div class="row"><div><h1>A little more organized.</h1><p class="muted">Plan the work, then add its grade to the same assessment.</p></div><span class="spacer"></span><button class="primary" id="addTask">+ Add task</button></div>${tabs()}<div class="toolbar">${['Agenda','This week','Overdue','Calendar','All tasks'].map(m=>`<button data-mode="${m}" class="${plannerMode===m?'primary':''}">${m}</button>`).join('')}</div><div class="card">${plannerMode==='Calendar'?calendar(list):taskTable(list)}</div>`;
 $('#addTask').onclick=()=>editItem();$('#app').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('#app').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{plannerMode=b.dataset.mode;render()});bindEdit();
 if(plannerMode==='Calendar'){for(const step of [-1,1])$('#month'+(step<0?'Prev':'Next')).onclick=()=>{calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+step,1);planner();};$('#calField').onchange=e=>{calendarField=e.target.value;planner()};}
}
function calendar(list){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<first.getDay();i++)cells+='<div class="day off"></div>';for(let d=1;d<=days;d++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<div class="day ${date===today()?'today':''}">${d}${list.filter(x=>x[calendarField]===date).map(x=>`<button data-edit="${esc(x.id)}" style="border-left:3px solid ${COLORS[x.subject]}">${esc(x.name)}</button>`).join('')}</div>`;}return `<div class="toolbar"><button id="monthPrev" aria-label="Previous month">←</button><h2 style="margin:0">${calendarDate.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button id="monthNext" aria-label="Next month">→</button><span class="spacer"></span><select id="calField" aria-label="Calendar date field"><option value="due" ${calendarField==='due'?'selected':''}>Due dates</option><option value="study" ${calendarField==='study'?'selected':''}>Study dates</option></select></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells}</div>`;}
function settings(){ $('#app').innerHTML=`<h1>Grading settings</h1><p class="muted">These rules apply only to ${esc(period().name)}. Changing them recalculates its grades.</p><div class="hint">Science and History use a multiplier for every individual assessment. Math, French, and Latin use percentages of the final class grade. The grand average treats all six classes equally.</div><form id="rulesForm"><div class="grid">${SUBJECTS.filter(s=>s!=='English').map(s=>{const r=period().rules[s];return `<section class="card rule"><h2>${s}</h2><span class="pill">${r.mode==='multiplier'?'Per-assessment multipliers':'Category percentages'}</span>${Object.entries(r.weights).map(([t,v])=>`<label>${t} ${r.mode==='multiplier'?'×':'%'}<input data-subject="${s}" data-type="${t}" type="number" min="0" step="any" required value="${v}"></label>`).join('')}</section>`}).join('')}</div><p id="ruleError" class="error"></p><button class="primary">Save weights</button></form><div class="card" style="margin-top:20px"><h3>Storage & study features</h3><p>This edition runs locally. It does not have login, cloud synchronization, AI chat, PDF extraction, or Notion synchronization. Notes and flashcards are available across grading periods; grades and tasks are separate for each period.</p><p class="muted">Use Import & backup to move your data to another browser or device. For source search, paste text from PDFs or slides, or import plain-text files. A true source-grounded AI assistant needs a hosted backend and model service; no API key belongs in this HTML file.</p></div>`;
 $('#rulesForm').onsubmit=e=>{e.preventDefault();const proposed=clone(period().rules);$('#rulesForm').querySelectorAll('input').forEach(i=>proposed[i.dataset.subject].weights[i.dataset.type]=Number(i.value));for(const s of SUBJECTS){const r=proposed[s],total=Object.values(r.weights).reduce((a,b)=>a+b,0);if(r.mode==='category'&&Math.abs(total-100)>.00001){$('#ruleError').textContent=s+' weights must total 100% (currently '+total+'%).';return;}if(r.mode==='multiplier'&&total===0){$('#ruleError').textContent=s+' needs at least one positive multiplier.';return;}}period().rules=proposed;save();render();toast('Weights saved.');};
}
function study(){const sources=data.sources.filter(s=>s.subject===studySubject),cards=data.cards.filter(c=>c.subject===studySubject);deckIndex=Math.min(deckIndex,Math.max(0,cards.length-1));const card=cards[deckIndex];
 $('#app').innerHTML=`<div class="row"><div><h1>Your study space</h1><p class="muted">Keep your sources together. Find evidence. Practice active recall.</p></div><span class="spacer"></span><select id="studySubject" style="width:160px">${opts(SUBJECTS,studySubject)}</select></div><div class="hint">Local study tools: notes, exact-source search, and self-graded flashcards. This is not an AI chat. PDF and slide text must be copied in; no automatic summaries are generated.</div><div class="two"><div class="card"><div class="row"><h2>Sources</h2><span class="spacer"></span><button class="small" id="newSource">+ Add notes</button><button class="small" id="uploadText">Import .txt</button></div><input type="file" id="textFile" accept=".txt,.md" hidden>${sources.map(s=>`<div class="row hit"><label style="margin:0"><input type="checkbox" data-sourcecheck="${esc(s.id)}" checked> ${esc(s.title)}</label><span class="spacer"></span><button class="small" data-read="${esc(s.id)}">Read / edit</button></div>`).join('')||'<p class="muted">Add textbook excerpts, class notes, or your own study guide.</p>'}<label for="sourceQuery">Search selected sources</label><div class="row"><input id="sourceQuery" placeholder="e.g. photosynthesis" style="flex:1"><button id="sourceSearch">Find</button></div><div id="hits"></div></div><div class="card"><div class="row"><h2>Practice cards</h2><span class="spacer"></span><button class="small" id="addCard">+ Create card</button></div>${card?`<span class="pill">${deckIndex+1} / ${cards.length}</span><div class="flash"><p>${esc(revealed?card.a:card.q)}</p></div>${revealed&&card.source?`<p class="muted">Source: ${esc(data.sources.find(s=>s.id===card.source)?.title||'Source removed')}</p>`:''}<div class="row"><button id="reveal">${revealed?'Show question':'Reveal answer'}</button><button id="nextCard">Next →</button><button class="small danger" id="removeCard">Delete card</button></div><p class="muted">Say or write your answer first, then reveal and compare.</p>`:'<div class="empty">Create question-and-answer cards from your notes. Answers stay hidden until you reveal them.</div>'}</div></div>`;
 $('#studySubject').onchange=e=>{studySubject=e.target.value;deckIndex=0;revealed=false;study()};$('#newSource').onclick=()=>sourceEditor();$('#uploadText').onclick=()=>$('#textFile').click();$('#textFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>500000){toast('Use a text file smaller than 500 KB.');return;}sourceEditor(null,{title:f.name,text:await f.text()});};$('#app').querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>sourceEditor(b.dataset.read));
 $('#sourceSearch').onclick=()=>{const query=$('#sourceQuery').value.trim().toLowerCase();if(!query){$('#hits').textContent='Enter a word or phrase.';return;}const selected=[...$('#app').querySelectorAll('[data-sourcecheck]:checked')].map(c=>c.dataset.sourcecheck),found=[];sources.filter(s=>selected.includes(s.id)).forEach(s=>s.text.split('\n').forEach((line,i)=>{if(line.toLowerCase().includes(query))found.push({s,line,i});}));$('#hits').innerHTML=found.length?found.slice(0,30).map(h=>`<div class="hit"><p>${esc(h.line)}</p><button class="small" data-hit="${esc(h.s.id)}">${esc(h.s.title)} · line ${h.i+1}</button></div>`).join('')+(found.length>30?'<p>First 30 matches shown. Narrow your search.</p>':''):'<p class="muted">No exact phrase match in the selected sources. Try a shorter term.</p>';$('#hits').querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>sourceEditor(b.dataset.hit));};$('#sourceQuery').onkeydown=e=>{if(e.key==='Enter')$('#sourceSearch').click()};
 $('#addCard').onclick=()=>{showModal(`<h2>Create a practice card</h2><form id="cardForm"><label for="cq">Question</label><textarea id="cq" required></textarea><label for="ca">Answer</label><textarea id="ca" required></textarea><label for="cs">Source (optional)</label><select id="cs"><option value="">My notes / no source</option>${sources.map(s=>`<option value="${esc(s.id)}">${esc(s.title)}</option>`).join('')}</select><div class="actions"><button class="primary">Save card</button></div></form>`);$('#cardForm').onsubmit=e=>{e.preventDefault();data.cards.push({id:uid(),subject:studySubject,q:$('#cq').value,a:$('#ca').value,source:$('#cs').value});save();$('#modal').close();study();};};
 if(card){$('#reveal').onclick=()=>{revealed=!revealed;study()};$('#nextCard').onclick=()=>{deckIndex=(deckIndex+1)%cards.length;revealed=false;study()};$('#removeCard').onclick=()=>{if(confirm('Delete this card?')){data.cards=data.cards.filter(c=>c.id!==card.id);save();study()}};}
}
function sourceEditor(id,preset){const s=data.sources.find(s=>s.id===id)||{id:uid(),subject:studySubject,title:preset?.title||'',text:preset?.text||''};showModal(`<h2>${id?'Read / edit source':'Add source text'}</h2><form id="sourceForm"><label for="stitle">Source title (include page numbers if useful)</label><input id="stitle" required maxlength="200" value="${esc(s.title)}"><label for="stext">Text · paste notes, PDF excerpts, or a study guide</label><textarea id="stext" required maxlength="500000" style="min-height:300px">${esc(s.text)}</textarea><div class="actions">${id?'<button type="button" class="danger" id="sourceDelete">Delete source</button>':''}<button class="primary">Save source</button></div></form>`);$('#sourceForm').onsubmit=e=>{e.preventDefault();const next={...s,title:$('#stitle').value,text:$('#stext').value};if(id)data.sources[data.sources.findIndex(x=>x.id===id)]=next;else data.sources.push(next);save();$('#modal').close();study();};if(id)$('#sourceDelete').onclick=()=>{if(confirm('Delete this source? Its practice cards will remain.')){data.sources=data.sources.filter(x=>x.id!==id);save();$('#modal').close();study();}};}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function exportBackup(){download('school-hub-backup-'+today()+'.json',JSON.stringify(data,null,2));toast('Backup downloaded. Keep it somewhere safe.');}
function csvCell(s){s=String(s??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCSV(){const header=['Name','Subject','Type','Grade','Due','Status','Priority','Study','Notes'];download('grades-'+today()+'.csv',[header,...items().map(x=>[x.name,x.subject,x.type,x.grade??'',x.due,x.status,x.priority,x.study,x.notes])].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');}
function dateOK(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else if(!quoted&&cell==='')quoted=true;else if(quoted)quoted=false;else throw Error('Unexpected quote in CSV.');}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('Unclosed quotation mark in CSV.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}
function backupPage(){$('#app').innerHTML=`<h1>Import & backup</h1><p class="muted">Bring old grades in quickly. Keep a copy of everything.</p><div class="two"><div class="card"><h2>Back up your hub</h2><p>A JSON backup contains all periods, grades, settings, sources, and practice cards.</p><div class="row"><button class="primary" id="exportJSON">Download backup</button><button id="restoreJSON">Restore backup</button><input id="jsonFile" type="file" accept=".json" hidden></div><p class="muted">Restoring replaces this browser's data after confirmation. The backup is unencrypted; keep it private.</p><button id="exportCSV">Export current grades as CSV</button></div><div class="card"><h2>Import old assessments</h2><p>Upload a CSV, map its columns, and review rows before importing. Exact duplicates are skipped. English overall and French participation are entered in Enter grades.</p><div class="row"><button id="csvSample">Download CSV template</button><button class="primary" id="csvUpload">Choose CSV</button><input id="csvFile" type="file" accept=".csv" hidden></div></div></div><div id="importPanel"></div>`;
 $('#exportJSON').onclick=exportBackup;$('#exportCSV').onclick=exportCSV;$('#restoreJSON').onclick=()=>$('#jsonFile').click();$('#jsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('Backup is too large (10 MB maximum).');const next=JSON.parse(await f.text());validateData(next);if(confirm('Replace all local data with this backup? Download your current backup first if needed.')){data=next;save();render();toast('Backup restored.');}}catch(err){toast('Could not restore: '+err.message);}};
 $('#csvSample').onclick=()=>download('grade-import-template.csv','Name,Subject,Type,Grade,Due,Status,Priority,Study,Notes\nExample quiz - replace me,Science,Quiz,95,,Complete,Medium,,\n','text/csv');$('#csvUpload').onclick=()=>$('#csvFile').click();$('#csvFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('CSV must be under 2 MB.');const rows=parseCSV(await f.text());if(rows.length<2)throw Error('Include a header and at least one data row.');importState={header:rows[0],rows:rows.slice(1)};importMapper();}catch(err){toast(err.message)}};
}
const FIELDS=['Name','Subject','Type','Grade','Due','Status','Priority','Study','Notes'];
function importMapper(){const h=importState.header;$('#importPanel').innerHTML=`<div class="card"><h2>1. Match columns</h2><p>Blank grade cells remain ungraded. Dates must use YYYY-MM-DD. Use percentages from 0 to 100.</p><div class="grid">${FIELDS.map(f=>`<label>${f}${['Name','Subject','Type'].includes(f)?' *':''}<select data-map="${f}"><option value="">Not included</option>${h.map((v,i)=>`<option value="${i}" ${v.trim().toLowerCase()===f.toLowerCase()?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`).join('')}</div><button class="primary" id="previewCSV" style="margin-top:20px">Preview import</button><div id="preview"></div></div>`;$('#previewCSV').onclick=previewImport;}
function previewImport(){const mapping={};$('#importPanel').querySelectorAll('[data-map]').forEach(s=>mapping[s.dataset.map]=s.value===''?null:Number(s.value));if(['Name','Subject','Type'].some(f=>mapping[f]===null)){toast('Map Name, Subject, and Type first.');return;}
 const existing=new Set(items().map(x=>fingerprint(x))),accepted=[],seen=new Set(existing),preview=[];let duplicate=0,invalid=0;
 importState.rows.forEach((row,i)=>{const get=k=>mapping[k]===null?'':String(row[mapping[k]]??'').trim();const subject=SUBJECTS.find(s=>s.toLowerCase()===get('Subject').toLowerCase()),rule=period().rules[subject],rawType=get('Type').replace(/^quizzes$/i,'Quiz').replace(/s$/i,''),type=Object.keys(rule?.weights||{}).find(t=>t.toLowerCase()===rawType.toLowerCase()),rawGrade=get('Grade').replace(/%$/,'').trim(),grade=rawGrade===''?null:Number(rawGrade);let reason='Ready';
 if(!get('Name')||!subject||!type||subject==='English'||type==='Participation'||!validGrade(grade)||(get('Due')&&!dateOK(get('Due')))||(get('Study')&&!dateOK(get('Study'))))reason='Invalid subject, type, grade, name, or date';
 const status=get('Status')|| (grade===null?'To do':'Complete'),priority=get('Priority')||'Medium';if(!['To do','Working','Submitted','Complete'].includes(status)||!['Low','Medium','High'].includes(priority))reason='Invalid status or priority';
 const x={id:uid(),period:data.active,name:get('Name'),subject,type,grade,due:get('Due'),study:get('Study'),status,priority,notes:get('Notes'),excluded:false};
 if(reason==='Ready'){const key=fingerprint(x);if(seen.has(key)){reason='Duplicate — skipped';duplicate++;}else{seen.add(key);accepted.push(x);}}else invalid++;
 preview.push({row:i+2,name:x.name,subject:get('Subject'),grade:get('Grade'),reason});});
 importState.accepted=accepted;$('#preview').innerHTML=`<h2 style="margin-top:24px">2. Review</h2><p>${accepted.length} ready · ${duplicate} duplicates skipped · ${invalid} invalid rows skipped</p><div class="tablewrap" style="max-height:350px"><table><thead><tr><th>CSV row</th><th>Name</th><th>Subject</th><th>Grade</th><th>Result</th></tr></thead><tbody>${preview.map(r=>`<tr><td>${r.row}</td><td>${esc(r.name)}</td><td>${esc(r.subject)}</td><td>${esc(r.grade)}</td><td>${esc(r.reason)}</td></tr>`).join('')}</tbody></table></div><button class="primary" id="commitImport" style="margin-top:16px" ${accepted.length?'':'disabled'}>Import ${accepted.length} assessments</button><p class="muted">Duplicate check: same period, name, subject, type, grade, and due date. Changed grades are separate rows—review them before importing.</p>`;$('#commitImport').onclick=()=>{const n=importState.accepted.length;data.items.push(...importState.accepted);save();importState=null;render();toast(n+' assessments imported.');};
}
function fingerprint(x){return JSON.stringify([x.period,x.name.trim().toLowerCase(),x.subject,x.type,x.grade,x.due]);}
$('#period').onchange=e=>{data.active=e.target.value;save();render();};$('#backupTop').onclick=exportBackup;
$('#newPeriod').onclick=()=>{showModal('<h2>Start a new grading period</h2><p class="muted">This creates empty grades and tasks with a copy of your current weights. Existing periods stay available in the selector.</p><form id="periodForm"><label for="pname">Period name</label><input id="pname" required maxlength="60" placeholder="e.g. Quarter 2"><div class="actions"><button class="primary">Create period</button></div></form>');$('#periodForm').onsubmit=e=>{e.preventDefault();const name=$('#pname').value.trim();if(!name)return;const p={id:uid(),name,rules:clone(period().rules),english:null,participation:null};data.periods.push(p);data.active=p.id;save();$('#modal').close();render();};};
render();
</script></body></html>
